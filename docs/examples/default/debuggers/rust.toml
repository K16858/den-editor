id = "rust-codelldb"
display_name = "Rust (CodeLLDB)"
command = "codelldb"
args = []
file_extensions = ["rs"]
dap_adapter_type = "codelldb"
not_found_hint = "Rust debug adapter 'codelldb' is missing. Install VS Code CodeLLDB extension or add codelldb to PATH."
launch_template = { name = "Debug current binary", type = "lldb", program = "${targetDebugBinary}" }
launch_overrides = { stopOnEntry = true }
