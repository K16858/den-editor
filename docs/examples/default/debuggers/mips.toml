id = "pluspim"
display_name = "MIPS (PlusPim)"
command = "PlusPim"
args = ["--debug", "${file}"]
file_extensions = ["asm"]
dap_adapter_type = "pluspim"
dap_transport = "tcp-server-dials-client"
client_addr_arg = "--connect"
health_check_args = ["--help"]
not_found_hint = "MIPS debug adapter 'PlusPim' is missing. Install it from https://github.com/hinshiba/PlusPim and add it to PATH."
launch_overrides = { stopOnEntry = true }
